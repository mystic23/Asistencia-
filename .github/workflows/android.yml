name: App Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/release/app-release.apk asistencia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: asistencia-apk
          path: asistencia.apk

      - name: Publicar en Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v${{ github.run_number }}" asistencia.apk \
            --target "${{ github.sha }}" \
            --title "App Android — versión ${{ github.run_number }}" \
            --notes "Descarga **asistencia.apk** desde el celular e instálala (permite instalar apps de origen desconocido). Cada versión nueva se instala encima de la anterior sin perder datos." \
            --latest
